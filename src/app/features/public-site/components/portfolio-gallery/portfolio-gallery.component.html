<div class="portfolio-gallery-grid">
  @for (item of galleryItems(); track item.id; let position = $index) {
    <button class="portfolio-gallery-trigger" type="button"
      [attr.aria-label]="lightboxLabel(item, position)" (click)="openLightbox(position)">
      <img [src]="item.src" [alt]="item.alt" [attr.aria-hidden]="item.decorative" [width]="item.width"
        [height]="item.height" [style.object-position]="item.objectPosition" loading="lazy" decoding="async" />
      @if (item.caption) {
        <span>{{ item.caption }}</span>
      }
    </button>
  }
</div>

<!-- O dialog nativo substitui o Galleria, hoje obsoleto, sem carregar uma biblioteca para este único controle. -->
<dialog #lightbox class="portfolio-gallery-lightbox" [attr.aria-label]="title()" (close)="handleDialogClose()">
  @if (activeItem(); as item) {
    <div class="portfolio-gallery-lightbox-content">
      <button class="portfolio-gallery-close" type="button" aria-label="Fechar galeria" i18n-aria-label
        autofocus (click)="closeLightbox()">
        <span aria-hidden="true"></span>
      </button>

      <figure class="portfolio-gallery-lightbox-figure">
        <img class="portfolio-gallery-lightbox-image" [src]="item.src" [alt]="item.alt"
          [attr.aria-hidden]="item.decorative" [width]="item.width" [height]="item.height"
          [style.object-position]="item.objectPosition" decoding="async" />
        @if (item.caption) {
          <figcaption class="portfolio-gallery-caption">{{ item.caption }}</figcaption>
        }
      </figure>

      @if (galleryItems().length > 1) {
        <button class="portfolio-gallery-navigation portfolio-gallery-navigation--previous" type="button"
          aria-label="Imagem anterior" i18n-aria-label (click)="showPrevious()">
          <span aria-hidden="true"></span>
        </button>
        <button class="portfolio-gallery-navigation portfolio-gallery-navigation--next" type="button"
          aria-label="Próxima imagem" i18n-aria-label (click)="showNext()">
          <span aria-hidden="true"></span>
        </button>

        <div class="portfolio-gallery-thumbnails" role="tablist" aria-label="Imagens do projeto" i18n-aria-label>
          @for (thumbnail of galleryItems(); track thumbnail.id; let position = $index) {
            <button class="portfolio-gallery-thumbnail-button" type="button" role="tab"
              [attr.aria-selected]="activeIndex() === position"
              [attr.aria-label]="lightboxLabel(thumbnail, position)" (click)="setActiveIndex(position)"
              (keydown.arrowleft)="showPrevious()" (keydown.arrowright)="showNext()">
              <img class="portfolio-gallery-thumbnail" [src]="thumbnail.src" alt="" [width]="thumbnail.width"
                [height]="thumbnail.height" [style.object-position]="thumbnail.objectPosition" loading="lazy"
                decoding="async" />
            </button>
          }
        </div>
      }
    </div>
  }
</dialog>
